function save(st){try{localStorage.setItem('zamer23',JSON.stringify(st))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(){
 var st=load(),h='',n=0,d=0,idx=0;
 G.forEach(function(g){
  h+='<h2>'+esc(g.m)+' — '+g.i.length+'</h2>';
  if(g.pod)h+='<div class="pod">'+esc(g.pod)+'</div>';
  g.i.forEach(function(it){
   var v=st[it.k]||{};n++;if(v.c)d++;

    +'<input class="ch" type="checkbox" data-i="'+idx+'" data-f="c" '+(v.c?'checked':'')+'>'
    +'<div class="body"><div class="n">'+esc(it.n)+' <span class="ed">'+esc(it.ed)+'</span></div>'
