var POVTORY = 310000, KLYUCH_KODA = "savvy-vhod";

function izBase64(s){
  var dv = atob(s), b = new Uint8Array(dv.length);
  for (var i = 0; i < dv.length; i++) b[i] = dv.charCodeAt(i);
  return b;
}

// Ключ из кода. Медленно намеренно: чем дороже один перебор, тем дороже все десять тысяч.
function klyuch(kod){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(kod), "PBKDF2", false, ["deriveKey"])
    .then(function(osnova){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:izBase64(SOL), iterations:POVTORY, hash:"SHA-256"},
        osnova, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    });
}

// Проверка кода - это и есть расшифровка. Отдельной проверки нет и быть не должно:
// иначе в файле пришлось бы хранить, с чем сравнивать.
function otkryt(kod){
  return klyuch(kod).then(function(k){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:izBase64(VEKTOR)}, k, izBase64(SHIFR));
  }).then(function(bayty){
    return new TextDecoder().decode(bayty);
  });
}

function narisovat(html){
  try { localStorage.setItem(KLYUCH_KODA, window.__kod); } catch(e){}
  document.open(); document.write(html); document.close();
}

var pole = document.getElementById("kod"), osh = document.getElementById("osh");

function poprobovat(kod, tiho){
  window.__kod = kod;
  osh.className = "zhdi"; osh.textContent = "Открываю...";
  return otkryt(kod).then(narisovat).catch(function(){
    osh.className = "osh";
    if (tiho) {
      // Запомненный код не подошёл: его сменили. Забываем и спрашиваем заново.
      try { localStorage.removeItem(KLYUCH_KODA); } catch(e){}
      osh.textContent = "";
    } else {
      osh.textContent = "Не подходит";
      pole.value = ""; pole.focus();
    }
  });
}

pole.addEventListener("input", function(){
  pole.value = pole.value.replace(/[^0-9]/g, "");
  osh.textContent = "";
  if (pole.value.length === 4) poprobovat(pole.value, false);
});

// Уже открывали на этом устройстве - открываем молча.
var zapomnennyy = null;
try { zapomnennyy = localStorage.getItem(KLYUCH_KODA); } catch(e){}
if (zapomnennyy && /^[0-9]{4}$/.test(zapomnennyy)) poprobovat(zapomnennyy, true);
else pole.focus();
</script>
