<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лист решений по каталогу</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f6f1e7;color:#222;margin:0;padding:14px;max-width:680px;margin:auto;-webkit-text-size-adjust:100%}
h1{font-size:21px;margin:6px 0 2px}
.sum{color:#555;font-size:14px;line-height:1.45;margin-bottom:14px}
h2{font-size:14px;color:#8a6d3b;margin:22px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.pod{font-size:13px;color:#777;margin-bottom:8px;line-height:1.4}
.row{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:7px}
.row.done{opacity:.55}
.num{color:#8a6d3b;font-weight:600;margin-right:4px}
.n{font-size:15px;line-height:1.35;word-wrap:break-word}
.d{color:#777;font-size:13px;margin-top:3px;line-height:1.35}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vars button{background:#f2ecdf;border:1px solid #d8cdb4;border-radius:8px;padding:7px 12px;font-size:14px;color:#444}
.vars button.sel{background:#2e7d32;color:#fff;border-color:#2e7d32}
.free{margin-top:7px}
.free input{font-size:15px;padding:7px 9px;border:1px solid #ccc;border-radius:7px;width:100%}
#reset{margin:18px 0 40px;background:none;border:1px solid #bbb;border-radius:8px;padding:9px 14px;font-size:14px;color:#555}
</style></head><body>
<h1>Лист решений по каталогу</h1>
<div class="sum" id="sum">Все открытые вопросы одним листом. Жми вариант - он запоминается
в телефоне. Можно вписать своё слово. Отвечать можно и в бот: «Р3 да», «Р7 вторая».</div>
<div id="list"></div>
<button id="reset">Сбросить все ответы</button>
<script>
var G=[
{g:"А. Спорные пары карточка - прайс: закрыто правилом Игоря 24.08",p:"«не надо привязывать - переделать под то, что есть в каталоге у поставщика». Все 20 пар переделаны под прайсовые строки (рис Янтарь, чечевица красная Мистраль, креветка тигровая, мидии и угорь RISMA, брюссельская и фасоль по единице прайса - за кг, молоко Крынка 0,9 л, коктейль ТОП Миндаль, салфетки Смарт); 75 несуществующих макаронных марок - в архив, ряд собран из прайса оптовика по бакалее; фундук «Д + С» - в архив, что это - спросить у оптовика по орехам при заказе; свежие (перец долма, шампиньоны) остаются рынком. Отвечать здесь нечего.",i:[]},
{g:"Б. Пары-двойники от первого прохода (6)",p:"«первая» / «вторая» - какую оставить на витрине, «обе» - это разные товары, живут обе.",i:[
{k:"D1",n:"Апельсины: SK-011 «Апельсины» 85 ₽ и FRU-016 «Апельсины Красные» 78 ₽ - обе видимы",d:"красные - другой товар или тот же склад?",v:["первая","вторая","обе"]},
{k:"D2",n:"Голени куриные: SK-024 280 ₽ и MYA-004 «голень охлаждённая Халяль» 260 ₽",d:"халяль пишется на витрине один раз - товар один?",v:["первая","вторая","обе"]},
{k:"D3",n:"Крылья куриные: SK-025 270 ₽ и MYA-003 «Халяль» 270 ₽ - цена одна",v:["первая","вторая","обе"]},
{k:"D4",n:"Голень индейки: SK-028 300 ₽ и MYA-002 «Халяль» 290 ₽",v:["первая","вторая","обе"]},
{k:"D5",n:"Зелёный лук: ZEL-005 «Лук зеленый» 285 ₽ и ZEL-018 «с головкой» 220 ₽",v:["первая","вторая","обе"]},
{k:"D6",n:"Куриное филе: MYA-007 «Халяль» 440 ₽ (видима) и TV-MSUL25XN «Филе куриной грудки» 440 ₽ (снята)",v:["первая","вторая","обе"]}
]},
{g:"В. Вопросы разведок",i:[
{k:"V1",n:"Помидоры: на витрине 4 обычных + черри. Оставить как есть или вернуть снятые сорта?",v:["как есть","вернуть"]},
{k:"V2",n:"Помидоры без подтверждённой цены от поставщика (4 карточки): показывать семье?",v:["показывать","снять"]},
{k:"V3",n:"Слово «ГОСТ» в имени 5 карточек (сгущёнка Рогачёв, кукуруза Rossana, тушёнка Скопин): убрать из витринного имени?",d:"ГОСТ - знак качества, но имя загромождает",v:["убрать","оставить"]},
{k:"V4",n:"Латиница брендов (LABNEH CHEESE, ТМ Sabah - 5 сырных карточек): переводить/убирать?",v:["перевести","оставить"]},
{k:"V5",n:"8 карточек птицы с ценой из розничного замера (MR-, окорочка, петушок, шейка): держать розничную цену или ждать оптовой?",v:["розница","ждать опта"]},
{k:"V6",n:"Лук крымский TV-MSUL40W4 180 ₽ против «Лук красный Ялтинский» OVO-023 110-155 ₽: один товар?",v:["один","разные"]},
{k:"V7",n:"Единицы: капуста пекинская - штука или кг?",v:["шт","кг"]},
{k:"V8",n:"Единицы: кукуруза бейби - упаковка 33 ₽, подпись «за 1 кг». Как продаём?",v:["уп","кг","снять"]},
{k:"V9",n:"Единицы: цыплёнок корнишон - штука 800 г или кг? (снят отбором как ресторанный - вернуть?)",v:["шт","кг","не возим"]},
{k:"V12",n:"Хлеб: 65 семей (25%) просят, на витрине нет ни раздела, ни карточки. Заводить?",v:["да","позже"]},
{k:"V13",n:"Рыба (65% семей) стоит в витрине девятым разделом, ниже «Бакалеи». Поднять выше?",v:["поднять","как есть"]},
{k:"V14",n:"Три пустых раздела (Мясная гастрономия, Товары для животных, Спортпит): спрятать, пока пустые?",v:["спрятать","оставить"]},
{k:"V15",n:"Весовые товары с рисованным фото: оставить рисунок или ждать настоящего?",v:["рисунок","ждать фото"]}
]},
{g:"Г. Спорное из пере-отбора витрины 24.08",i:[
{k:"O1",n:"Говядина мякоть двумя карточками: SK-017 770 ₽ и MYA-027 «Халяль» 750 ₽ (обе от одного поставщика мясного ряда, обе видимы, 137 семей)",d:"слить или это разные отрубы?",v:["первая","вторая","обе"]},
{k:"O2",n:"Гауда: 36 семей просят, на витрине нет. SYR-043 «Гауда беловежская» 539 ₽ собрана, но вес головки неизвестен (родственная карточка - 4,4 кг). Вернуть?",v:["вернуть","узнать вес"]},
{k:"O3",n:"Сахар-песок: 42 семьи просят, в каталоге только пудра. Заводить карточку и искать поставщика?",v:["да","позже"]},
{k:"O4",n:"Пюре АВС (Сергей, 65 ₽): не маркировано как детское. Показывать в «Детских товарах»?",d:"снято из Детского до решения; 4 карточки",v:["показывать","в другой раздел","не возим"]},
{k:"O5",n:"Калинов газировка: оставил Лимонад и Тархун, снял Дюшес и Апельсин. Верно?",v:["да","вернуть все 4"]},
{k:"O6",n:"Йогурты питьевые вкусовые (вишня/клубника/черника) снял - классика (натуральный) осталась. Вернуть один вкус детям?",v:["нет","вернуть один"]},
{k:"O8",n:"Кофе от нашего поставщика кофе: 9 сортов по 1000 г внесены за кг, показан только La Plata 5720 ₽, остальные 8 сняты твоим давним «показ решает Игорь». Показывать все девять?",v:["все","только La Plata","снять все"]},
{k:"O9",n:"Боржоми 0,5 стекло на витрине - а правило «стекла нет». Оставить как исключение?",v:["оставить","снять"]},
{k:"O11",n:"Тестовые учётки распознаются по началу телефона +7999 - но 999 это живой код российских операторов: настоящая семья с таким номером на бою станет «проверочной», её заказы не поедут. Как быть?",d:"вопрос важен до PR в main",v:["оставить до боя, пересмотреть перед запуском","отдельное поле-признак от правления"]},
{k:"O10",n:"Пустой поставщик в справочнике (имя не пишем, он там такой один): 0 карточек. Нужен?",d:"если будет возить - оставим; если завели по ошибке - уберём",v:["нужен","убрать"]},
{k:"O7",n:"Сулугуни: 43 семьи просят, годной карточки нет. В прайсах два кандидата: настоящий сулугуни головой ~14 кг у оптовика по бакалее (голова велика, режем ли?) и «продукт белково-жировой» фасовкой 500 г - 2 кг у другого (это не сыр). Что берём?",d:"проверено: каталог целиком и все прайсы",v:["Стародубский","ЮКМП","искать другого","не возим"]}
]},
{g:"Д. Сверка закупочных с источниками, 25.08",p:"Сверил все 1345 закупочных с их источниками (строка прайса, телеграм-бот с ценами, замер). Сошлось 1340. Бесспорное поправил сам - 27 карточек. Здесь только то, где решать тебе.",i:[
{k:"C1",n:"Фарш говяжий: карточка SK-019 видна семье по 500 ₽, а у поставщика та же позиция идёт по 750 ₽ - и наша закупочная записана 500",d:"документа от поставщика нет, строка составлена по нашей же витрине. Рядом карточка-двойник MYA-015 по 750 ₽. Какая цена настоящая?",v:["500","750","спросить поставщика"]},
{k:"C2",n:"Арбуз FRU-064 (видна, 43 ₽): привязан к «Арбуз Российский» - такой строки нет ни в одном документе",d:"в источнике цен есть «Арбуз (Иран)» от 20.07 - по нашей нынешней цене 43 ₽ - и «Арбуз (РФ)» от 18.08, заметно дешевле. Какой возим?",v:["Иран","РФ","снять"]},
{k:"C3",n:"Перец чили Натрули SPC-003: перевязал на свою строку, закупка упала почти вдвое, а витрина осталась 33 ₽",d:"надбавки сейчас нет: по правилу цена витрины = закупочной, это 20 ₽. Опускать цену семье - твоё решение",v:["опустить до 20","оставить 33"]},
{k:"C4",n:"14 карточек у оптовика по орехам и сухофруктам (финики, курага, орехи): закупочная у нас записана уже поделённой на короб - цена короба превратилась в цену за килограмм",d:"числа верные, но в документе стоит цена короба, и система такую пару не сводит: защиты от убытка на этих карточках нет. Что хранить в закупочной?",v:["цену документа","приведённую к нашей мере"]},
{k:"C5",n:"Яйцо MUK-020: у поставщика фасовка записана как «36дес», а у нас цена стоит за десяток",d:"система не берётся читать «36дес». За короб из 360 яиц такая цена невозможна - подтверди, что это цена десятка",v:["за десяток","за короб"]},
{k:"C6",n:"Сок яблочный прямого отжима NAP-007 (видна, 85 ₽): яблочного сока у поставщика нет вовсе",d:"есть только «Яблоко-виноград» - и он уже стоит на карточке NAP-008",v:["переделать под яблоко-виноград","снять","искать другого"]},
{k:"C7",n:"Манка VICTORIA KRP-317 (видна, 36 ₽) привязана к строке другой марки - «Мистраль», 800 г",d:"марка не та, и цена расходится втрое. Строки VICTORIA у поставщика нет",v:["переделать под Мистраль","снять","искать другого"]},
{k:"C8",n:"Хозтовары (контейнеры, салфетки, туалетная бумага, полотенца): спрятаны от семьи ложным убытком",d:"в прайсе поставщика хозтоваров от 20.04 цена короба, у нас цена штуки - система читает это как продажу ниже закупки. Прайсу четыре месяца",v:["ждать новый прайс","привести руками"]},
{k:"C9",n:"Кофе Якобс 47,5 г CHK-007: поднял витрину с 176 до 198 ₽ - у поставщика та же позиция дороже прежней нашей цены, продавали в убыток",d:"карточка и так снята с витрины. Подтверди подъём",v:["верно","вернуть 176"]},
{k:"C10",n:"Карточка SLU-001 «Служебная позиция для проб программиста» с ценой 50 ₽ и закупочной без документа",v:["убрать","оставить"]},
{k:"C11",n:"Молоко Бабушкина крынка 3,2% 0,9 л (MOL-154): единственная строка у поставщика помечена «Не заказывать»",v:["снять карточку","держать"]},
{k:"C12",n:"Молоко Минская марка 3,2% 0,9 л (MOL-006): две строки с одинаковой ценой - /Минск/ и /Молочный Гостинец/",d:"взял /Минск/ по марке на карточке. Цена одна и та же",v:["верно","Молочный Гостинец"]},
{k:"C13",n:"42 карточки стоят выше закупочной",d:"надбавка выключена твоим словом 20.08, значит цена витрины должна равняться закупочной. Опускать все 42 или выработать правило надбавки?",v:["опустить до закупочной","ждать правила надбавки"]}
]}

];
var KEY="resheniya-2026-08-24";
var S=JSON.parse(localStorage.getItem(KEY)||"{}");
function save(){localStorage.setItem(KEY,JSON.stringify(S));draw();}
function draw(){
var el=document.getElementById("list");el.innerHTML="";var otv=0,vsego=0;
G.forEach(function(g){
var h=document.createElement("h2");h.textContent=g.g;el.appendChild(h);
if(g.p){var p=document.createElement("div");p.className="pod";p.textContent=g.p;el.appendChild(p);}
g.i.forEach(function(q){
vsego++;var r=document.createElement("div");r.className="row"+(S[q.k]?" done":"");
var n=document.createElement("div");n.className="n";
n.innerHTML='<span class="num">'+q.k+'</span>'+q.n;r.appendChild(n);
if(q.d){var d=document.createElement("div");d.className="d";d.textContent=q.d;r.appendChild(d);}
var vs=document.createElement("div");vs.className="vars";
q.v.forEach(function(v){
var b=document.createElement("button");b.textContent=v;
if(S[q.k]===v)b.className="sel";
b.onclick=function(){S[q.k]=(S[q.k]===v?undefined:v);save();};
vs.appendChild(b);});
r.appendChild(vs);
var f=document.createElement("div");f.className="free";
var inp=document.createElement("input");inp.placeholder="или своим словом...";
if(S[q.k]&&q.v.indexOf(S[q.k])<0)inp.value=S[q.k];
inp.onchange=function(){S[q.k]=inp.value||undefined;save();};
f.appendChild(inp);r.appendChild(f);
if(S[q.k])otv++;
el.appendChild(r);});});
document.getElementById("sum").textContent="Отвечено "+otv+" из "+vsego+". Ответы живут в телефоне; можно отвечать и в бот: «Р3 да», «Д2 вторая», «В12 да».";
}
document.getElementById("reset").onclick=function(){if(confirm("Стереть все ответы?")){S={};save();}};
draw();
</script></body></html>
